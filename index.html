  :root{
    --navy:#001a4d;
    --navy-2:#002466;
    --ink:#0b1a3a;
    --yellow:#FFF000;
    --paper:#e9eefb;
    --line:rgba(255,255,255,.14);
    --radius:14px;
    --font:'Lidl Font Pro','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);
    background:
      radial-gradient(120% 80% at 85% -10%, #003a8c 0%, transparent 55%),
      var(--navy);
    color:#fff;
    min-height:100vh;
    padding:clamp(20px,4vw,56px);
    line-height:1.4;
  }
  .wrap{max-width:1180px;margin:0 auto}

  header{margin-bottom:clamp(24px,3vw,40px)}
  .eyebrow{
    font-weight:700;font-size:.8rem;letter-spacing:.02em;
    color:#8fb0e8;margin-bottom:.35rem;
  }
  h1{
    font-weight:900;
    font-size:clamp(2rem,5.2vw,3.6rem);
    line-height:1.02;
    letter-spacing:-0.01em;
  }
  h1 .accent{color:var(--yellow)}
  .lede{
    margin-top:.9rem;
    max-width:56ch;
    font-size:clamp(.95rem,1.6vw,1.05rem);
    color:#cdd9f2;
    font-weight:600;
  }
  .lede kbd{
    background:var(--yellow);color:var(--ink);
    font-family:var(--font);font-weight:800;
    padding:.05em .45em;border-radius:6px;font-size:.9em;
  }

  .family{margin-top:clamp(26px,3.4vw,44px)}
  .family-head{
    display:flex;align-items:baseline;gap:.7rem;
    margin-bottom:.85rem;padding-bottom:.55rem;
    border-bottom:1px solid var(--line);
  }
  .family-head h2{
    font-weight:900;font-size:1.15rem;letter-spacing:-0.01em;
  }
  .family-head span{font-weight:600;font-size:.82rem;color:#8fb0e8}

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(12px,1.6vw,20px);
  }

  .swatch{
    position:relative;
    border:none;
    border-radius:var(--radius);
    padding:18px 18px 16px;
    min-height:190px;
    text-align:left;
    cursor:pointer;
    font-family:var(--font);
    display:flex;flex-direction:column;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 10px 26px rgba(0,0,0,.28);
    overflow:hidden;
  }
  .swatch:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.36)}
  .swatch:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .swatch.light{color:#fff}
  .swatch.dark{color:var(--ink)}

  .swatch .name{font-weight:800;font-size:1rem;letter-spacing:-0.01em}
  .swatch.primary .name{margin-top:22px}

  /* couleurs principales */
  .swatch.primary{
    box-shadow:0 0 0 3px var(--accent, var(--yellow)), 0 14px 30px rgba(0,0,0,.34);
  }
  .swatch.primary:hover{
    box-shadow:0 0 0 3px var(--accent, var(--yellow)), 0 18px 38px rgba(0,0,0,.42);
  }
  .badge{
    position:absolute;top:14px;left:14px;
    font-size:.62rem;font-weight:900;letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 8px;border-radius:999px;
    background:var(--accent, var(--yellow));
    color:var(--accent-text, var(--ink));
  }
  .swatch .hex{
    margin-top:auto;
    font-weight:900;
    font-size:clamp(1.5rem,3vw,1.9rem);
    letter-spacing:.01em;
  }
  .meta{
    margin-top:10px;
    display:grid;grid-template-columns:auto 1fr;
    gap:2px 10px;
    font-size:.72rem;font-weight:600;
    opacity:.82;
  }
  .meta b{font-weight:800;opacity:.7}

  .copyhint{
    position:absolute;top:14px;right:14px;
    font-size:.68rem;font-weight:800;
    display:flex;align-items:center;gap:5px;
    opacity:.55;transition:opacity .12s ease;
  }
  .swatch:hover .copyhint{opacity:.9}
  .copyhint svg{width:14px;height:14px}

  /* état copié */
  .swatch.copied .copyhint{opacity:1}
  .swatch .done{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    gap:6px;font-weight:900;font-size:.95rem;
    background:rgba(0,0,0,.14);
    opacity:0;pointer-events:none;
    transition:opacity .14s ease;
    letter-spacing:.01em;
  }
  .swatch .done svg{width:14px;height:14px;flex:none}
  .swatch.dark .done{background:rgba(255,255,255,.18)}
  .swatch.copied .done{opacity:1}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--yellow);color:var(--ink);
    font-weight:900;font-size:.95rem;
    padding:12px 20px;border-radius:999px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{
    margin-top:clamp(28px,4vw,48px);
    padding-top:16px;border-top:1px solid var(--line);
    font-size:.78rem;font-weight:600;color:#8fb0e8;
  }

  .section-title{
    font-weight:900;
    font-size:clamp(1.5rem,3.4vw,2.2rem);
    letter-spacing:-0.01em;
    margin:0 0 clamp(16px,2.4vw,26px);
    display:flex;align-items:center;gap:14px;
  }
  .section-title::after{
    content:"";flex:1;height:3px;border-radius:2px;
    background:var(--yellow);opacity:.85;
  }
  .section-title.second{margin-top:clamp(56px,7vw,88px)}

  .subbrand-name{
    font-weight:900;font-size:1.05rem;letter-spacing:-0.01em;
    margin:0 0 .7rem;
  }
  .swatch.compact{min-height:148px}

  @media (max-width:720px){
    .grid{grid-template-columns:1fr}
    .swatch{min-height:160px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <h2 class="section-title">Corporate Brand Palette</h2>
  <main id="app"></main>

  <h2 class="section-title second">Sub-brand Palettes</h2>
  <div id="subbrands"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const groups = [
  { family:"Bleu", note:"Qualité, sécurité, confiance", colors:[
    {name:"Lidl Dark Blue",  hex:"#002466", rgb:"0 · 36 · 102", cmyk:"100 · 70 · 0 · 50", pantone:"648 C", ral:"5013", text:"light"},
    {name:"Lidl Blue",       hex:"#0050AA", rgb:"0 · 80 · 170", cmyk:"100 · 62 · 0 · 10", pantone:"4152 C", ral:"5010", text:"light", primary:true},
    {name:"Lidl Light Blue", hex:"#008CD2", rgb:"0 · 140 · 210", cmyk:"80 · 30 · 0 · 0", pantone:"2382 C", ral:"5015", text:"light"},
  ]},
  { family:"Jaune", note:"Fraîcheur, vitalité", colors:[
    {name:"Lidl Dark Yellow", hex:"#FFC400", rgb:"255 · 196 · 0", cmyk:"0 · 25 · 90 · 0", pantone:"7408 C", ral:"1004", text:"dark"},
    {name:"Lidl Yellow",      hex:"#FFF000", rgb:"255 · 240 · 0", cmyk:"0 · 0 · 100 · 0", pantone:"102 C", ral:"1021", text:"dark", primary:true, accent:"#E60A14", accentText:"#fff"},
    {name:"Lidl Light Yellow",hex:"#FFED70", rgb:"255 · 237 · 112", cmyk:"0 · 0 · 65 · 0", pantone:"100 C", ral:"1016", text:"dark"},
  ]},
  { family:"Rouge", note:"Attire l'œil, éveille la curiosité", colors:[
    {name:"Lidl Dark Red",   hex:"#AD080F", rgb:"173 · 8 · 15", cmyk:"0 · 100 · 100 · 35", pantone:"2350 C", ral:"3011", text:"light"},
    {name:"Lidl Red",        hex:"#E60A14", rgb:"230 · 10 · 20", cmyk:"0 · 100 · 100 · 0", pantone:"485 C", ral:"3020", text:"light", primary:true},
    {name:"Lidl Light Red",  hex:"#FF6E66", rgb:"255 · 110 · 102", cmyk:"0 · 70 · 50 · 0", pantone:"6046 C", ral:"3017", text:"dark"},
  ]},
];

const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

const app = document.getElementById("app");
const toast = document.getElementById("toast");
let toastTimer;

groups.forEach(g => {
  const sec = document.createElement("section");
  sec.className = "family";
  const grid = document.createElement("div");
  grid.className = "grid";

  g.colors.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "swatch " + c.text + (c.primary ? " primary" : "");
    btn.style.background = c.hex;
    if(c.accent) btn.style.setProperty('--accent', c.accent);
    if(c.accentText) btn.style.setProperty('--accent-text', c.accentText);
    btn.type = "button";
    btn.setAttribute("aria-label", `Copier le code hexadécimal ${c.hex} de ${c.name}`);
    btn.innerHTML = `
      <span class="copyhint">${copyIcon} HEX</span>
      ${c.primary ? '<span class="badge">Primary</span>' : ''}
      <span class="name">${c.name}</span>
      <span class="hex">${c.hex}</span>
      <span class="meta">
        <b>RGB</b><span>${c.rgb}</span>
        <b>CMYK</b><span>${c.cmyk}</span>
        <b>Pantone</b><span>${c.pantone}</span>
        <b>RAL</b><span>${c.ral}</span>
      </span>
      <span class="done">${checkIcon} Copié !</span>`;
    btn.addEventListener("click", () => copyHex(c.hex, btn));
    grid.appendChild(btn);
  });
  sec.appendChild(grid);
  app.appendChild(sec);
});

const subBrands = [
  { name:"Esmara",      colors:[ {hex:"#FFF3E3", rgb:"255 · 243 · 227", text:"dark"} ] },
  { name:"Silvercrest", colors:[ {hex:"#CCCCCC", rgb:"204 · 204 · 204", text:"dark"} ] },
  { name:"Parkside",    colors:[ {hex:"#1E4B32", rgb:"30 · 75 · 50", text:"light"}, {hex:"#CD2828", rgb:"205 · 40 · 40", text:"light"} ] },
  { name:"Crivit",      colors:[ {hex:"#FF7828", rgb:"255 · 120 · 40", text:"dark"} ] },
  { name:"Livarno",     colors:[ {hex:"#CEC1A7", rgb:"206 · 193 · 167", text:"dark"} ] },
];

const sub = document.getElementById("subbrands");
subBrands.forEach(b => {
  const sec = document.createElement("section");
  sec.className = "family";
  sec.innerHTML = `<h3 class="subbrand-name">${b.name}</h3>`;
  const grid = document.createElement("div");
  grid.className = "grid";

  b.colors.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "swatch compact " + c.text;
    btn.style.background = c.hex;
    btn.type = "button";
    btn.setAttribute("aria-label", `Copier le code hexadécimal ${c.hex} de ${b.name}`);
    btn.innerHTML = `
      <span class="copyhint">${copyIcon} HEX</span>
      <span class="name">${b.name}</span>
      <span class="hex">${c.hex}</span>
      <span class="meta"><b>RGB</b><span>${c.rgb}</span></span>
      <span class="done">${checkIcon} Copié !</span>`;
    btn.addEventListener("click", () => copyHex(c.hex, btn));
    grid.appendChild(btn);
  });
  sec.appendChild(grid);
  sub.appendChild(sec);
});

async function copyHex(hex, btn){
  let ok = false;
  try{
    await navigator.clipboard.writeText(hex);
    ok = true;
  }catch(e){
    // fallback pour les contextes sans Clipboard API
    try{
      const ta = document.createElement("textarea");
      ta.value = hex; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(_){ ok = false; }
  }

  if(ok){
    document.querySelectorAll(".swatch.copied").forEach(s=>s.classList.remove("copied"));
    btn.classList.add("copied");
    setTimeout(()=>btn.classList.remove("copied"), 1100);
    showToast(`${hex} copié`);
  }else{
    showToast("Copie impossible — sélectionnez le code manuellement");
  }
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 1600);
}
</script>
</body>
</html>
